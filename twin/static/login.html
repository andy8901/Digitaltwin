<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · TAVAS Digital Twin Command Centre</title>
<link rel="icon" href="/static/neosky-emblem.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
    :root { --bg: #05070a; --panel: #0d1216; --line: #273340; --text: #e6edf2; --muted: #8796a3; --cyan: #54c8e8; --red: #ff4b4b; color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; color: var(--text);
        font: 14px/1.4 'Barlow', 'Segoe UI', system-ui, sans-serif;
        background: radial-gradient(ellipse at 50% 30%, #0f1d26 0%, var(--bg) 65%);
    }
    body::before {
        content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .35;
        background-image: linear-gradient(#0f1820 1px, transparent 1px), linear-gradient(90deg, #0f1820 1px, transparent 1px);
        background-size: 48px 48px;
    }
    .box { position: relative; width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--cyan); border-radius: 6px; padding: 28px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 40px; height: 40px; }
    .brand b { display: block; font: 700 26px/1 'Barlow Condensed', sans-serif; letter-spacing: .24em; color: var(--cyan); }
    .brand small { display: block; font: 600 11px 'Barlow Condensed', sans-serif; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin-top: 4px; }
    p { color: var(--muted); margin: 18px 0 8px; font-size: 13.5px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .08em; }
    input { width: 100%; height: 38px; background: #05080b; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 0 11px; font: inherit; }
    input:focus, button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
    button { width: 100%; height: 40px; margin-top: 20px; border: 0; border-radius: 6px; background: var(--cyan); color: #021016; font: 700 14px 'Barlow', sans-serif; letter-spacing: .04em; cursor: pointer; }
    button:hover { background: #79d8f2; }
    .err { color: var(--red); font-size: 13.5px; margin-top: 12px; }
    .ver { color: #5b6874; font-size: 12px; margin-top: 18px; text-align: center; }
</style>
</head>
<body>
<form class="box" method="post" action="/login">
    <div class="brand"><img src="/static/neosky-emblem.png" alt=""><span><b>TAVAS</b><small>Digital Twin Command Centre</small></span></div>
    <p>Live monitoring of the TAVAS fleet: video, telemetry, alerts and health from every ground station.</p>
    <label for="u">User name</label><input id="u" name="username" autocomplete="username" required autofocus>
    <label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div class="err" id="err" hidden>That user name and password don't match.</div>
    <div class="ver">v{{VERSION}} · monitoring only</div>
</form>
<script>if (location.search.includes('error')) document.getElementById('err').hidden = false;</script>
</body>
</html>
